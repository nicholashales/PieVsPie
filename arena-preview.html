<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIE VS PIE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial Black', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        h1 {
            color: #f4e4c1;
            font-size: 4em;
            text-shadow: 3px 3px 0 #dc143c;
            margin-bottom: 30px;
            letter-spacing: 8px;
        }
        
        .vs {
            color: #dc143c;
            display: inline-block;
            transform: rotate(-5deg);
        }
        
        .fight-card {
            background: rgba(244, 228, 193, 0.95);
            padding: 16px 18px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 18px;
            border: 5px solid #dc143c;
            max-width: 520px;
            width: 100%;
        }
        
        .pie-code-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px dashed #dc143c;
            text-align: left;
            width: auto;
        }
        
        .pie-code-section label {
            font-size: 0.95em;
            color: #dc143c;
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap;
            margin-bottom: 0;
        }
        
        .pie-code-section input {
            padding: 4px 8px;
            font-size: 0.8em;
            border: 2px solid #1a1a2e;
            border-radius: 6px;
            background: white;
            text-align: center;
            font-weight: bold;
            min-width: 0;
            width: 120px;
            max-width: 140px;
            text-transform: uppercase;
        }
        
        .fighter-selection {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }
        
        .fighter {
            text-align: center;
            flex: 1 1 0;
        }
        
        .fighter label {
            display: block;
            font-size: 0.95em;
            margin-bottom: 4px;
            color: #1a1a2e;
        }
        
        .fighter select {
            padding: 8px 10px;
            font-size: 0.95em;
            border: 3px solid #1a1a2e;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: bold;
            min-width: 220px;
            width: auto;
        }
        
        .vs-text {
            font-size: 1.6em;
            color: #dc143c;
            font-weight: bold;
            text-shadow: 2px 2px 0 #1a1a2e;
            align-self: center;
        }
        
        .ring {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto 0;
            display: flex;
            justify-content: center;
        }
        
        #arenaCanvas {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .results-section {
            background: rgba(244, 228, 193, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 40px;
            border: 5px solid #228b22;
            max-width: 600px;
            width: 100%;
        }
        
        .winner-selection {
            margin-bottom: 20px;
        }
        
        .winner-selection h3 {
            color: #1a1a2e;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .radio-group {
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
            color: #1a1a2e;
            cursor: pointer;
        }
        
        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .tasting-notes {
            margin-top: 20px;
        }
        
        .tasting-notes h3 {
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .tasting-notes textarea {
            width: 100%;
            padding: 15px;
            font-size: 1em;
            border: 3px solid #1a1a2e;
            border-radius: 8px;
            resize: vertical;
            min-height: 100px;
            font-family: Arial, sans-serif;
        }
        
        .submit-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.4em;
            font-weight: bold;
            background: linear-gradient(135deg, #dc143c 0%, #a00000 100%);
            color: #f4e4c1;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .submit-btn:hover {
            background: linear-gradient(135deg, #ff1744 0%, #dc143c 100%);
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }

        /* Responsive tweaks */
        @media (max-width: 480px) {
            body {
                justify-content: flex-start;
                padding: 15px 10px;
            }

            h1 {
                font-size: 2.4em;
                letter-spacing: 4px;
                margin-bottom: 16px;
                text-align: center;
            }

            .fight-card {
                padding: 14px;
                margin-bottom: 14px;
            }

            .pie-code-section {
                flex-direction: column;
                align-items: stretch;
            }

            .pie-code-section label {
                text-align: center;
            }

            .pie-code-section input {
                max-width: 100%;
                width: 100%;
            }

            .fighter-selection {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .fighter select {
                min-width: 0;
                width: 100%;
            }

            .vs-text {
                font-size: 1.3em;
                margin: 2px 0;
            }

            .ring {
                margin-top: 12px;
            }

            .results-section {
                width: 100%;
                padding: 20px;
                margin-top: 20px;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
            }

            .submit-btn {
                font-size: 1.1em;
                padding: 14px;
            }
        }
        .arena-links { margin: 0 auto 16px; }
        .arena-links a { color: #f4e4c1; }
        .battle-message, .vote-list { font: 16px/1.45 Arial, sans-serif; overflow-wrap: anywhere; }
        .vote-list { padding-left: 1.5em; }
        .vote-list li { border-top: 1px solid #bba88b; padding: .75em 0; }
        .vote-list p { white-space: pre-wrap; margin: 0 0 .5em; }
        .battle-action { font: bold 1rem Arial, sans-serif; margin: .2em .4em .2em 0; padding: .5em; }
        .form-status { min-height: 1.45em; }
    </style>
</head>
<body>
    <h1>PIE <span class="vs">VS</span> PIE</h1>
    
    <nav class="arena-links"><a href="/rules">Rules of Engagement</a></nav>
    <div class="fight-card">
        <form class="pie-code-section" id="loadBattle">
            <label for="pieCode">Mince Meet #</label>
            <input type="text" id="pieCode" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" required>
            <button class="battle-action">Load fight</button>
        </form>
        <p class="battle-message" id="battleStatus" role="status">Scan a fight card or enter its code.</p>
        <div class="fighter-selection">
            <div class="fighter" style="text-align:left; width:auto; max-width:260px; align-self:flex-start;">
                <label for="redFighter">RED CORNER</label>
                <select id="redFighter" disabled></select>
            </div>
            
            <div class="vs-text">VS</div>
            
            <div class="fighter" style="text-align:right; width:auto; max-width:260px; align-self:flex-end;">
                <label for="whiteFighter">WHITE CORNER</label>
                <select id="whiteFighter" disabled></select>
            </div>
        </div>
    </div>
    
    <div class="ring">
        <canvas id="arenaCanvas" width="957" height="800"></canvas>
    </div>
    
    <form class="results-section" id="judgeForm">
        <fieldset id="judgeControls" disabled style="border:0;padding:0;min-width:0">
        <div class="winner-selection">
            <h3>🏆 DECLARE WINNER</h3>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="winner" value="red" required>
                    <span id="redLabel">Red corner</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="winner" value="white">
                    <span id="whiteLabel">White corner</span>
                </label>
            </div>
        </div>
        
        <div class="tasting-notes">
            <h3><label for="tastingNotes">📝 TASTING NOTES</label></h3>
            <textarea id="tastingNotes" maxlength="4000" placeholder="Summarise the pies. Did the mince convince? Was the crust a must? Was the flavour to savour?"></textarea>
        </div>
        
        <button id="submitBtn" class="submit-btn">ADD JUDGE VOTE 🥊</button>
        <button type="button" class="battle-action" id="cancelEdit" hidden>Cancel edit</button>
        </fieldset>
        <p class="battle-message form-status" id="voteStatus" role="status"></p>
    </form>
    <section class="results-section" aria-labelledby="votesHeading">
        <h3 id="votesHeading">JUDGE VOTES</h3>
        <p class="battle-message" id="score"></p>
        <ol id="votes" class="vote-list"></ol>
        <ul id="outbox" class="vote-list" aria-label="Votes awaiting confirmation"></ul>
    </section>

    <script type="module" src="/arena/arena.js"></script>
</body>
</html>
